html {

/* Animated star background */

pointer-events: none;
z-index: 0;

}
.star {
position: absolute;
border-radius: 50%;
background: white;
animation: twinkle var(–d) infinite ease-in-out;

}
@keyframes twinkle {

50% { opacity: var(–op); transform: scale(1); }

display: none;
flex-direction: column;
align-items: center;
gap: 20px;
animation: fadeUp 0.5s ease forwards;

.screen.active { display: flex; }

@keyframes fadeUp {
from { opacity: 0; transform: translateY(20px); }
to   { opacity: 1; transform: translateY(0); }

/* ── SECTION TITLE ── */

width: 100%;
margin-top: 8px;

padding: 28px 16px 24px;
text-align: center;
cursor: pointer;
border: 2px solid transparent;
transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
overflow: hidden;
user-select: none;
}
.cat-card::before {

position: absolute;
inset: 0;
opacity: 0;
transition: opacity 0.3s;
}
.cat-card:hover { transform: translateY(-4px); }

background: linear-gradient(145deg, #0a2550, #0d3070);
box-shadow: 0 8px 32px rgba(0,123,255,0.2);
}

background: radial-gradient(circle at 50% 0%, rgba(0,191,255,0.15), transparent 70%);

.cat-card.friendly.selected {
border-color: var(–sky);
box-shadow: 0 0 30px rgba(0,191,255,0.4);
}
.cat-card.naughty {
background: linear-gradient(145deg, #2a0a1a, #3d0d28);
box-shadow: 0 8px 32px rgba(255,107,157,0.15);
}
.cat-card.naughty::before {
background: radial-gradient(circle at 50% 0%, rgba(245,200,66,0.12), transparent 70%);
}
.cat-card.naughty.selected {
border-color: var(–rose);
box-shadow: 0 0 30px rgba(255,107,157,0.4);
}

.cat-card .cat-name {

font-size: 1.1rem;

}
.cat-card .cat-desc {
font-size: 0.72rem;
color: var(–silver);
margin-top: 4px;
line-height: 1.4;
}
.cat-card .check {

top: 10px;
right: 12px;
font-size: 1.2rem;
opacity: 0;
transition: opacity 0.3s;
}
.cat-card.selected .check { opacity: 1; }

60%  { transform: rotate(-8deg) scale(1.08); }
80%  { transform: rotate(5deg) scale(0.97); }

      --op:${(Math.random()*0.6+0.2).toFixed(2)};
      animation-delay:${(Math.random()*5).toFixed(1)}s;
    `;
    c.appendChild(s);
  }
}

// ── CATEGORY SELECT ───────────────────────────────────────────
function selectCat(el) {
  document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedCat = el.dataset.cat;
  document.getElementById('start-btn').disabled = false;
  const btn = document.getElementById('start-btn');
  if (selectedCat === 'naughty') {
    btn.className = 'btn btn-naughty';
    btn.textContent = 'Let\'s Get Naughty 🔥';
  } else {
    btn.className = 'btn btn-primary';
    btn.textContent = 'Let\'s Play →';
  }
}

function startGame() {
  showScreen('screen-game');
  const badge = document.getElementById('mode-badge-el');
  if (selectedCat === 'naughty') {
    badge.className = 'mode-badge naughty';
    badge.innerHTML = '🔥 Naughty Mode';
    document.getElementById('done-btn').className = 'btn btn-naughty';
    document.getElementById('done-btn').style.flex = '1';
  } else {
    badge.className = 'mode-badge friendly';
    badge.innerHTML = '💙 Friendly Mode';
  }
  setPlayer('him');
}

// ── PLAYER ────────────────────────────────────────────────────
function setPlayer(p) {
  currentPlayer = p;
  document.getElementById('btn-him').classList.toggle('active', p === 'him');
  document.getElementById('btn-her').classList.toggle('active', p === 'her');
  const tn = document.getElementById('turn-name');
  if (p === 'him') {
    tn.textContent = '👨 His Turn';
    tn.className = 'turn-name him';
    document.getElementById('dice').className = 'dice';
    document.getElementById('dice-glow').className = 'dice-glow';
  } else {
    tn.textContent = '👩 Her Turn';
    tn.className = 'turn-name her';
    document.getElementById('dice').className = 'dice her-mode';
    document.getElementById('dice-glow').className = 'dice-glow her';
  }
  // Clear task
  document.getElementById('task-area').innerHTML = '';
  document.getElementById('action-row').style.display = 'none';
  document.getElementById('dice').textContent = '🎲';
  document.getElementById('dice-result').textContent = 'Tap the dice to roll!';
}

// ── ROLL ──────────────────────────────────────────────────────
function rollDice() {
  if (rolling) return;
  rolling = true;
  const dice = document.getElementById('dice');
  const taskArea = document.getElementById('task-area');
  const actionRow = document.getElementById('action-row');

  taskArea.innerHTML = '';
  actionRow.style.display = 'none';
  dice.classList.add('rolling');

  let count = 0;
  const interval = setInterval(() => {
    dice.textContent = DICE_FACES[Math.floor(Math.random() * 6)];
    count++;
  }, 80);

  setTimeout(() => {
    clearInterval(interval);
    const roll = Math.floor(Math.random() * 6) + 1;
    dice.textContent = DICE_FACES[roll - 1];
    dice.classList.remove('rolling');
    document.getElementById('dice-result').textContent = `Rolled a ${roll}!`;
    rolling = false;
    showTask();
  }, 700);
}

// ── TASK ──────────────────────────────────────────────────────
function showTask() {
  const pool = TASKS[selectedCat][currentPlayer];
  const used = usedTasks[selectedCat][currentPlayer];

  if (used.length >= pool.length) {
    usedTasks[selectedCat][currentPlayer] = [];
    showToast('🔄 Tasks reset — going again!');
  }

  const available = pool.map((_, i) => i).filter(i => !usedTasks[selectedCat][currentPlayer].includes(i));
  currentTaskIndex = available[Math.floor(Math.random() * available.length)];
  usedTasks[selectedCat][currentPlayer].push(currentTaskIndex);

  const task = pool[currentTaskIndex];
  const isHer = currentPlayer === 'her';
  const cardClass = isHer ? 'her-card' : 'him-card';
  const badge = isHer ? '👩 Her Task' : '👨 His Task';
  const num = currentTaskIndex + 1;

  const html = `
    <div class="task-card ${cardClass}">
      <div class="shimmer"></div>
      <div class="task-number">Task #${num} of 25</div>
      <div class="task-text">${task}</div>
      <div class="task-player-badge">${badge}</div>
    </div>
  `;

  const ta = document.getElementById('task-area');
  ta.innerHTML = html;
  document.getElementById('action-row').style.display = 'flex';
  ta.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── DONE / SKIP ───────────────────────────────────────────────
function doneTask() {
  scores[currentPlayer]++;
  document.getElementById(`score-${currentPlayer}`).textContent = scores[currentPlayer];
  confetti();
  showToast(currentPlayer === 'him' ? '👨 He did it! +1 point' : '👩 She did it! +1 point');
  switchTurn();
}

function skipTask() {
  showToast('Skipped — no point 😅');
  switchTurn();
}

function switchTurn() {
  setTimeout(() => {
    const next = currentPlayer === 'him' ? 'her' : 'him';
    setPlayer(next);
  }, 600);
}

// ── CONFETTI ──────────────────────────────────────────────────
function confetti() {
  const colors = ['#007BFF','#00BFFF','#F5C842','#FF6B9D','#ffffff'];
  for (let i = 0; i < 28; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `
      left:${20 + Math.random()*60}%;
      top:${-10}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      --dur:${(Math.random()*1.2+0.8).toFixed(2)}s;
      animation-delay:${(Math.random()*0.4).toFixed(2)}s;
      width:${Math.random()*8+4}px;
      height:${Math.random()*8+4}px;
      border-radius:${Math.random()>0.5?'50%':'2px'};
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2400);
  }
}

// ── TOAST ─────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── RESET ─────────────────────────────────────────────────────
function resetGame() {
  selectedCat = null;
  currentPlayer = 'him';
  scores = { him: 0, her: 0 };
  usedTasks = { friendly: { him: [], her: [] }, naughty: { him: [], her: [] } };
  document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('start-btn').disabled = true;
  document.getElementById('start-btn').className = 'btn btn-primary';
  document.getElementById('start-btn').textContent = "Let's Play →";
  showScreen('screen-cat');
}

// ── SCREEN SWITCH ─────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── INIT ──────────────────────────────────────────────────────
initStars();
</script>
